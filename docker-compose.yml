services:
  claude:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID}
        HOST_GID: ${HOST_GID}
    working_dir: /workspace
    environment:
      # Folder the auto-started upload server drops files into (a gitignored
      # uploads/ inbox, set per project in .aliases). Server always on port 8000.
      UPLOAD_DIR: ${UPLOAD_DIR:-/workspace/uploads}
    volumes:
      - ${HOME}/Projects:/workspace
      - ${HOME}/Projects/.claude-data:/home/node/.claude
      - ${HOME}/Projects/.claude-data.json:/home/node/.claude.json
      # Jail-only git identity. Host ~/.gitconfig is deliberately NOT mounted so
      # the jail can use its own author name/email. Edit .claude-data.gitconfig.
      - ${HOME}/Projects/.claude-data.gitconfig:/home/node/.gitconfig
      # Shared Nix store so Devbox tooling (per-project devbox.json) works identically in
      # the jail and on the host. Requires Nix/Devbox installed on the host (it provides /nix).
      - /nix:/nix
    # No ports: here on purpose. Each alias in .aliases publishes its own host
    # ports with -p (e.g. -p 8001:8000), so sessions don't collide and only the
    # main jail maps the OAuth port 54545.
    stdin_open: true
    tty: true
    env_file:
      - .env
