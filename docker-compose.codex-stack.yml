# Scoped Codex stack: credentials/mounts come only from stack-jail.sh.
services:
  codex-stack:
    image: codex-jail-codex
    build:
      context: .
      target: codex
      args:
        HOST_UID: ${JAIL_UID:?Use tools/stack-jail.sh}
        HOST_GID: ${JAIL_GID:?Use tools/stack-jail.sh}
        CODEX_VERSION: ${CODEX_VERSION:-0.155.1}
    working_dir: /workspace
    environment:
      CODEX_HOME: /home/node/.codex
      JAIL_HOMELAB_SEAT: "0"
      TERM: ${TERM:-xterm-256color}
      TZ: ${TZ:-Europe/Tallinn}
    volumes:
      - ${JAIL_ROOT:?Use tools/stack-jail.sh}/tools:/workspace/tools:ro
      - ${JAIL_ROOT:?Use tools/stack-jail.sh}/.claude-data.gitconfig:/home/node/.gitconfig-base:ro
      - /nix:/nix
    stdin_open: true
    tty: true
