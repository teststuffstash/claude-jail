services:
  claude:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID}
        HOST_GID: ${HOST_GID}
    working_dir: /workspace
    environment:
      # Folder the auto-started upload server drops files into (a gitignored
      # uploads/ inbox, set per project in .aliases). Server always on port 8000.
      UPLOAD_DIR: ${UPLOAD_DIR:-/workspace/uploads}
    volumes:
      - ${HOME}/Projects:/workspace
      - ${HOME}/Projects/.claude-data:/home/node/.claude
      - ${HOME}/Projects/.claude-data.json:/home/node/.claude.json
      # Jail-only git identity. Host ~/.gitconfig is deliberately NOT mounted so
      # the jail can use its own author name/email. Edit .claude-data.gitconfig.
      - ${HOME}/Projects/.claude-data.gitconfig:/home/node/.gitconfig
      # Shared Nix store so Devbox tooling (per-project devbox.json) works identically in
      # the jail and on the host. Requires Nix/Devbox installed on the host (it provides /nix).
      - /nix:/nix
    # No ports: here on purpose. Each alias in .aliases publishes its own host
    # ports with -p (e.g. -p 8001:8000), so sessions don't collide and only the
    # main jail maps the OAuth port 54545.
    stdin_open: true
    tty: true
    env_file:
      - .env

  # oracle stack-jail — the first per-stack jail (middle-ground permissions, see
  # tools/stack-jail.sh header). Differences from `claude` on purpose:
  #   - mounts ONLY the oracle stack dirs, not all of ~/Projects (homelab is
  #     shallow-cloned inside by tools/stack-jail-init.sh — the host checkout
  #     holds gitignored secrets: tofu state, kubeconfigs)
  #   - its own .claude-data-oracle state (the mono jail's ~/.claude holds the
  #     homelab-* secret dirs; they must not leak into a stack jail)
  #   - env_file .env.oracle only: the stack PAT + homelab token, NOT the
  #     mono jail's org-wide GH_TOKEN/FORGEJO_TOKEN
  # Launch via tools/stack-jail.sh (the alias), not `docker compose run` directly —
  # it pre-creates the state files and mints the per-session kube token.
  oracle:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID}
        HOST_GID: ${HOST_GID}
    working_dir: /workspace/oracle-fleet
    environment:
      UPLOAD_DIR: ${UPLOAD_DIR:-/workspace/oracle-fleet/uploads}
    volumes:
      - ${HOME}/Projects/oracle-fleet:/workspace/oracle-fleet
      - ${HOME}/Projects/oracle-iac:/workspace/oracle-iac
      # Business context (docs-only, no secrets in the working tree) — read-only.
      - ${HOME}/Projects/teststuff:/workspace/teststuff:ro
      # tools/ read-only: the upload server + stack-jail-init.sh live here
      - ${HOME}/Projects/tools:/workspace/tools:ro
      - ${HOME}/Projects/.claude-data-oracle:/home/node/.claude
      - ${HOME}/Projects/.claude-data-oracle.json:/home/node/.claude.json
      # Shared jail git identity, read-only at a side path; stack-jail-init.sh
      # copies it to ~/.gitconfig and appends the per-repo credential config.
      - ${HOME}/Projects/.claude-data.gitconfig:/home/node/.gitconfig-base:ro
      - /nix:/nix
    stdin_open: true
    tty: true
    env_file:
      - .env.oracle
