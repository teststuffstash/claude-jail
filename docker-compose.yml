services:
  claude:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID}
        HOST_GID: ${HOST_GID}
    working_dir: /workspace
    environment:
      # Set here, not in an override file: every launcher passes `-f docker-compose.yml`,
      # which stops compose from loading docker-compose.override.yml at all.
      TZ: ${TZ:-Europe/Tallinn}
      TERM: xterm-256color
      COLORTERM: truecolor
      # Folder the auto-started upload server drops files into (a gitignored
      # uploads/ inbox, set per project in .aliases). Server always on port 8000.
      UPLOAD_DIR: ${UPLOAD_DIR:-/workspace/uploads}
      # Per-jail identity on the OTLP telemetry (homelab#566): the collector already
      # promotes resource attrs to metric labels, so jail_name lands in Prometheus and
      # `sum by (jail_name, session_id)` answers "which jail burned what". JAIL_NAME is
      # set by each alias in .aliases (default main). This is the SINGLE writer of
      # OTEL_RESOURCE_ATTRIBUTES — the old copy in .claude-data/settings.json was
      # removed 2026-08-18 (a shared-file value cannot differ per container, and env
      # precedence between the two sources is ambiguity nobody needs).
      OTEL_RESOURCE_ATTRIBUTES: service.name=claude-code,role=jail,stack=jail,jail.name=${JAIL_NAME:-main}
      # The browser sidecar (service `browser` below): the entrypoint registers this URL as
      # the `browser` MCP server in ~/.claude.json. Empty = no registration.
      JAIL_BROWSER_MCP_URL: http://jail-browser:8931/mcp
    networks: [default, browser]
    depends_on: [browser]   # `docker compose run` starts dependencies — the aliases need no change
    volumes:
      - ${HOME}/Projects:/workspace
      - ${HOME}/Projects/.claude-data:/home/node/.claude
      # Overlay the credentials file as a SINGLE-FILE mount on top of the dir
      # mount, matching the stack service. On a file mountpoint the CLI's atomic
      # rename fails (EBUSY) and it falls back to an in-place copy, so the host
      # inode never changes. Without this, a mono-jail token refresh renames a
      # new inode into .claude-data/ and every stack jail (pinned to the old
      # inode by its file mount) drifts stale → "Login expired" within ~8h.
      - ${HOME}/Projects/.claude-data/.credentials.json:/home/node/.claude/.credentials.json
      - ${HOME}/Projects/.claude-data.json:/home/node/.claude.json
      # Jail-only git identity. Host ~/.gitconfig is deliberately NOT mounted so
      # the jail can use its own author name/email. Edit .claude-data.gitconfig.
      - ${HOME}/Projects/.claude-data.gitconfig:/home/node/.gitconfig
      # Mono-jail shell history (stack jails get a per-stack file from tools/stack-jail.sh).
      - ${HOME}/Projects/.claude-data.zsh_history:/home/node/.zsh_history
      # Shared Nix store so Devbox tooling (per-project devbox.json) works identically in
      # the jail and on the host. Requires Nix/Devbox installed on the host (it provides /nix).
      - /nix:/nix
    # No ports: here on purpose. Each alias in .aliases publishes its own host
    # ports with -p (e.g. -p 8001:8000), so sessions don't collide and only the
    # main jail maps the OAuth port 54545.
    stdin_open: true
    tty: true
    env_file:
      - .env

  # Generic STACK-JAIL service (middle-ground permissions, see tools/stack-jail.sh
  # header). One service for every per-stack jail — everything stack-specific
  # (project mounts, state files, tokens, UPLOAD_DIR) is passed by the launcher
  # via `docker compose run -v/-e`, so a new stack jail is a case-block entry in
  # tools/stack-jail.sh, not a compose edit. Never `docker compose run stack`
  # directly. Differences from `claude` on purpose:
  #   - NO ~/Projects mount: only the stack dirs the launcher passes (homelab is
  #     shallow-cloned inside by tools/stack-jail-init.sh — the host checkout
  #     holds gitignored secrets: tofu state, kubeconfigs)
  #   - per-stack .claude-data-<stack> state (the mono jail's ~/.claude holds
  #     the homelab-* secret dirs; they must not leak into a stack jail)
  #   - no .env: the launcher sources .env.<stack> and passes only its keys
  stack:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID}
        HOST_GID: ${HOST_GID}
    working_dir: /workspace
    environment:
      TZ: ${TZ:-Europe/Tallinn}
      TERM: xterm-256color
      COLORTERM: truecolor
      # Same per-jail OTLP identity as the claude service (homelab#566); stack-jail.sh
      # sets JAIL_NAME="<stack>-stack" and passes it through.
      OTEL_RESOURCE_ATTRIBUTES: service.name=claude-code,role=jail,stack=jail,jail.name=${JAIL_NAME:-stack}
      JAIL_BROWSER_MCP_URL: http://jail-browser:8931/mcp
    networks: [default, browser]
    depends_on: [browser]
    volumes:
      # tools/ read-only: the upload server + stack-jail-init.sh live here
      - ${HOME}/Projects/tools:/workspace/tools:ro
      # Subscription OAuth shared with the mono jail — the proven login-once
      # pattern (multiple jail sessions already share this file live). Only the
      # credentials file crosses over; the rest of .claude-data/ (homelab-*
      # secret dirs) stays out of stack jails.
      - ${HOME}/Projects/.claude-data/.credentials.json:/home/node/.claude/.credentials.json
      # Shared jail git identity, read-only at a side path; stack-jail-init.sh
      # copies it to ~/.gitconfig and appends the per-repo credential config.
      - ${HOME}/Projects/.claude-data.gitconfig:/home/node/.gitconfig-base:ro
      - /nix:/nix
    stdin_open: true
    tty: true

  # BROWSER SIDECAR — one headless Chromium per host, shared by every jail (Claude mono, Claude
  # stack, Codex mono, Codex stack), so no jail image bakes Chromium + its ~40 system libraries
  # and no Dockerfile churns on browser releases. The upstream Playwright MCP image already
  # bundles the MCP server + Chromium (entrypoint: `node /app/cli.js --headless --browser
  # chromium --no-sandbox`; `command:` below appends to it). Each MCP session gets its own
  # in-memory browser context (--isolated, no --shared-browser-context): nothing persists.
  #   - reachable ONLY on the `jail-browser` docker network (no published port, no host/LAN
  #     exposure); jails address it as http://jail-browser:8931/mcp (streamable HTTP) and their
  #     entrypoints register it as the `browser` MCP server (tools/mcp-register.py).
  #   - --allowed-hosts is the server's DNS-rebinding check: it compares the FULL Host header
  #     (host:port, lowercased) — keep the port in every entry.
  #   - --allowed-origins/--blocked-origins are politeness, not a boundary (upstream says so);
  #     the browser has exactly the host's egress, nothing a jail's `curl` lacks.
  #   - hardened like a work-variant sidecar: read-only root, no capabilities, no mounts, tmpfs
  #     for the profile/output/NSS db, memory + pid caps. Chromium is fine with all of that
  #     because Playwright passes --disable-dev-shm-usage and the image runs as `node` (1000).
  #   - lifecycle: started by any jail launch (depends_on), left running between sessions, no
  #     restart policy (gone after a host reboot until the next launch). Host-side verbs:
  #     tools/jail-browser.sh up|down|status|logs|pull. The network itself is external, created
  #     by setup-env.sh / jail-browser.sh — the Codex compose projects join the same one.
  #   - image pin: bump the tag by hand (no Renovate on this repo); releases at
  #     https://github.com/microsoft/playwright-mcp/releases. Pulls ride mcr.microsoft.com
  #     directly (the host dockerd mirrors Hub only).
  browser:
    image: mcr.microsoft.com/playwright/mcp:v0.0.83
    container_name: jail-browser
    command:
      - --port=8931
      - --host=0.0.0.0
      - --isolated
      - --output-dir=/tmp/playwright-mcp
      - --user-agent
      - "Mozilla/5.0 (X11; Linux x86_64) claude-jail browser sidecar (+https://github.com/teststuffstash/claude-jail)"
      - --allowed-hosts
      - jail-browser:8931,browser:8931,127.0.0.1:8931,localhost:8931
    networks: [browser]
    read_only: true
    # /home/node owned by node: a tmpfs mounts root:root 0755, and Chromium (uid 1000) aborts
    # when it cannot create its crashpad database under $HOME.
    tmpfs: [/tmp, "/home/node:uid=1000,gid=1000,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    pids_limit: 512
    healthcheck:
      # Any HTTP answer from the MCP endpoint = the server is up (a GET without a session is a
      # 4xx by design). node's fetch exists in the image; curl does not.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8931/mcp').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  # Shared with docker-compose.codex*.yml (external there too — one network for every jail
  # on the host). Created by setup-env.sh / tools/jail-browser.sh, never by a compose project,
  # so no project owns its labels and every project may join it.
  browser:
    name: jail-browser
    external: true
